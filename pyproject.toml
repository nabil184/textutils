[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils-nabil184"
version = "0.2.0"
description = "A lightweight Python library for common text-processing operations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "black==25.1.0",
    "ruff==0.9.7",
    "pre-commit>=3,<5",
]

[project.urls]
Homepage = "https://github.com/nabil184/textutils"
Repository = "https://github.com/nabil184/textutils"
Issues = "https://github.com/nabil184/textutils/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["textutils", "textutils.*"]
exclude = ["*.tests", "*.tests.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["textutils"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["textutils"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
